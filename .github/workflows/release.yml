# Builds, tests, scans and pushes the public Docker image (spec, "Release": GitHub Actions builds, tests, scans with
# Trivy and pushes tagged images; D-33).
#
# A tag such as v0.1.0 pushes krixerx/patchbay:0.1.0, :0.1 and :latest for linux/amd64 and linux/arm64.
# Run by hand (Actions > release > Run workflow) on a branch, it builds, tests and scans without pushing,
# unless "push" is ticked; a push by hand is tagged with the branch name and the commit, never latest.
#
# Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token with
# Read & Write on krixerx/patchbay).
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: krixerx/patchbay

jobs:
  test:
    name: Tests (engine and console)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: engine/console/package-lock.json
      - name: Engine tests
        working-directory: engine
        run: mvn -B test
      - name: Console tests and typecheck
        working-directory: engine/console
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

  image:
    name: Build, scan and push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # latest only for a release tag; a tag with a suffix (v0.2.0-rc.1) gets no latest and no short tags.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=ref,event=branch
            type=sha

      # The same image the push below sends, for amd64, loaded into the runner's Docker to be scanned first.
      - name: Build image for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: engine
          platforms: linux/amd64
          load: true
          tags: scan/patchbay:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails on HIGH/CRITICAL vulnerabilities that have a fix available, as security.yml does.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/patchbay:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: engine/.trivyignore.yaml

      - name: Log in to Docker Hub
        if: github.event_name == 'push' || inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        if: github.event_name == 'push' || inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: engine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
