# Multipart bodies are read by Patchbay itself (D-29, Multipart): Spring would parse them first, with a 1 MB limit,
# and Camel would then want its attachments library and temp files.
spring.servlet.multipart.enabled=false

# Integration calls mostly wait for external systems. Virtual threads let Tomcat and Camel's platform-http consumer
# run any number of them at once; without this, platform-http ran every call on Boot's 8-thread task executor (NFR-001).
spring.threads.virtual.enabled=true

# Health only (no other actuator endpoint): /actuator/health/liveness and /actuator/health/readiness. Readiness turns
# UP after ConfigLoader has loaded every integration (it runs on ApplicationReadyEvent, before ACCEPTING_TRAFFIC).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
